name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Upstream analytics tag reports to the original author. Strip it from the
      # build only, so that the source stays in sync with upstream.
      - name: Remove analytics tag
        run: |
          perl -0pi -e 's#<script async src="https://www\.googletagmanager\.com/gtag/js[^"]*"></script>\s*<script>.*?</script>\s*##s' dist/index.html
          if grep -q -E 'googletagmanager|gtag\(' dist/index.html; then
            echo "Analytics tag is still present in dist/index.html" && exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
